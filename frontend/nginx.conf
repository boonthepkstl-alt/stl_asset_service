server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing: fall back to index.html for any
    # unmatched path instead of nginx's own 404. Deliberately omits the
    # `$uri/` directory-match fallback -- Vite's build output has a real
    # `assets/` directory (hashed JS/CSS chunks) that collides with this
    # app's own `/assets` (Asset Registry) client-side route; matching
    # directories would 301-redirect `/assets` to `/assets/` instead of
    # serving the SPA shell.
    location / {
        try_files $uri /index.html;
    }

    # index.html references the current build's hashed JS/CSS filenames -- it must NEVER
    # be cached by the browser, or a rebuilt/redeployed container (new hashes) stays
    # invisible to anyone whose browser is still serving a stale cached index.html
    # (confirmed live: without this, a hard navigate reused a cached index.html pointing
    # at a JS chunk the new container no longer even has on disk). `location /` above has
    # no Cache-Control of its own, which is NOT the same as "uncached" -- browsers apply
    # heuristic caching to any response without an explicit directive.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Reasonable caching for hashed build assets -- safe to cache aggressively since a
    # new build always gets a new filename (content-hashed by Vite).
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
