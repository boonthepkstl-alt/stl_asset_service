name: CI

# Runs the same checks SESSION-CLOSEOUT-PROTOCOL.md step 3 requires every session to run
# by hand ("actually run them -- don't assume they still pass because they passed last
# time"). Until now that was enforced only by discipline, across 88 merged PRs verified
# locally; this makes it evidence attached to the PR instead.
#
# Deliberately NOT path-filtered. This repo merges a lot of docs-only PRs (#73, #75, #77,
# #85, #88), and skipping the jobs for those would save a few minutes -- but a job skipped
# by a `paths` filter never reports a status, so the moment anyone turns on branch
# protection with these as required checks, docs PRs would sit un-mergeable forever. The
# wasted minutes are the cheaper side of that trade.

# Actions are pinned to their latest majors: checkout/setup-node/setup-go v4-v5 target
# Node 20, which GitHub-hosted runners now force onto Node 24 with a deprecation warning
# on every run.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete; don't pay for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (raise-frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 6 + Vitest 2 support 18/20/22; 22 is the current LTS.
          node-version: '22'

      # setup-node's own `cache: npm` caches the npm *download* cache, which measured at
      # only ~3 minutes off a 7-minute install: `npm ci` deletes and rebuilds node_modules
      # from scratch every run regardless, and writing that tree is the actual cost.
      # Caching the built tree instead takes the install to near-zero on the common case
      # (a PR that doesn't touch dependencies).
      #
      # Exact key only, no `restore-keys`: a partial match would give a node_modules that
      # doesn't correspond to the lockfile. Any miss falls through to a full `npm ci`,
      # which is also what happens whenever package-lock.json changes -- so the lockfile
      # is still validated by npm on every change to it.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Ordered cheapest-to-most-expensive so an obvious failure reports fast.
      # Each step runs even if an earlier one failed, so a single run reports every
      # problem at once rather than making you fix-push-wait to discover the next.
      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Type check
        if: '!cancelled()'
        run: npx tsc --noEmit

      - name: Test
        if: '!cancelled()'
        run: npm run test

      # `npm run build` is `tsc && vite build`, so this re-runs the type check. Kept
      # anyway: it is the only step that exercises the production Rollup build, which
      # can fail on things tsc cannot see (bad dynamic import, asset resolution).
      - name: Build
        if: '!cancelled()'
        run: npm run build

  backend:
    name: Backend (go-template-main)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-template-main
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read the version from go.mod (currently 1.23.0) so this file never drifts
          # from the module's own declared toolchain.
          go-version-file: go-template-main/go.mod
          cache-dependency-path: go-template-main/go.sum

      - name: Build
        if: '!cancelled()'
        run: go build ./...

      - name: Vet
        if: '!cancelled()'
        run: go vet ./...

      - name: Test
        if: '!cancelled()'
        # `-count=1` disables the test result cache, and it is load-bearing rather than
        # belt-and-braces. `service/slaContract_test.go` reads
        # `frontend/src/services/ticket-service.ts`, which is OUTSIDE this Go module, and
        # the test cache does not track it: verified 2026-09-09 by editing the frontend map
        # to a wrong value and running twice -- plain `go test` reported `ok (cached)` while
        # `-count=1` reported FAIL. Without this flag a frontend-only drift can be served a
        # stale green, which is the exact silent pass that test exists to prevent.
        run: go test -count=1 ./...

      # `gofmt` IS a gate, as of 2026-09-07. The note that used to sit here said it could
      # not be, because "its Go sources are committed with CRLF line endings, so `gofmt -l`
      # lists every file in the module on a Linux runner". **That was never tested and is
      # false.** All 64 Go files were extracted with `git show :<path>` -- the content a
      # runner actually checks out -- and none contained a CR. The CRLF is
      # `core.autocrlf=true` translating on a Windows working tree, which a Linux runner
      # never sees, so the line-ending reason never applied to CI.
      #
      # It did NOT follow that CI was already clean, and the first version of this note said
      # so wrongly. On its very first run this gate failed, correctly, on
      # controller/internalErrorLeak_test.go -- a real missing blank line introduced in
      # PR #103 that the CRLF noise had been masking locally. Fixed in the same change.
      #
      # `.gitattributes` now pins `*.go text eol=lf` so a contributor with
      # `core.autocrlf=false` cannot commit CRLF and turn this gate red for a reason that
      # has nothing to do with code quality.
      - name: Format check
        if: '!cancelled()'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat these files:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w ."
            gofmt -d $unformatted
            exit 1
          fi
          echo "gofmt: all files formatted"
