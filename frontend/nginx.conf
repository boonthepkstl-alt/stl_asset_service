server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing: fall back to index.html for any
    # unmatched path instead of nginx's own 404. Deliberately omits the
    # `$uri/` directory-match fallback -- Vite's build output has a real
    # `assets/` directory (hashed JS/CSS chunks) that collides with this
    # app's own `/assets` (Asset Registry) client-side route; matching
    # directories would 301-redirect `/assets` to `/assets/` instead of
    # serving the SPA shell.
    location / {
        try_files $uri /index.html;
    }

    # Reasonable caching for hashed build assets; index.html itself is not
    # matched by this pattern and stays uncached so deploys take effect.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
